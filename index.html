<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PrintDesk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#121212;
    color:#eee;
    font-family:Arial,sans-serif;
    padding-bottom:75px;
}

header{
    padding:15px;
    text-align:center;
    background:#1e1e1e;
    color:#00adb5;
    font-size:21px;
    font-weight:700;
    border-bottom:1px solid #333;
}

.container{
    max-width:650px;
    margin:auto;
    padding:15px;
}

.card,
.spool,
.history{
    background:#1e1e1e;
    border:1px solid #333;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.card h3{
    color:#00adb5;
    margin:0 0 15px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#252525;
    border-radius:9px;
    padding:12px;
    text-align:center;
}

.val{
    font-size:19px;
    font-weight:bold;
    margin-top:5px;
}

.green{
    color:#4caf50;
}

.btn{
    width:100%;
    border:0;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
    background:#00adb5;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.btn.secondary{
    background:#333;
}

.btn.danger{
    background:#8b2222;
}

.field{
    margin-bottom:12px;
}

.field label{
    display:block;
    color:#aaa;
    font-size:14px;
    margin-bottom:5px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:10px;
    border:1px solid #444;
    border-radius:7px;
    background:#252525;
    color:#fff;
    font-size:15px;
}

.field textarea{
    min-height:80px;
    resize:vertical;
}

.result{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px dashed #444;
}

.total{
    font-weight:700;
    font-size:18px;
    padding:11px 0;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#1e1e1e;
    border-top:1px solid #333;
    display:flex;
    z-index:10;
}

.nav div{
    flex:1;
    text-align:center;
    padding:8px 3px;
    color:#888;
    font-size:12px;
    cursor:pointer;
}

.nav .active{
    color:#00adb5;
    font-weight:700;
}

.nav span{
    display:block;
    font-size:18px;
    margin-bottom:2px;
}

.status{
    text-align:center;
    color:#aaa;
    font-size:13px;
    min-height:20px;
    margin-top:10px;
}

.empty{
    color:#999;
    text-align:center;
    padding:15px;
}

.delete{
    float:right;
    background:none;
    border:0;
    color:#ff5252;
    font-size:18px;
    cursor:pointer;
}

.spool-title{
    display:flex;
    align-items:center;
    gap:9px;
    padding-right:30px;
}

.color-dot{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid #777;
    display:inline-block;
    flex:none;
}

.history-color{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid #777;
    display:inline-block;
    vertical-align:middle;
    margin-right:7px;
}

.small{
    color:#999;
    font-size:13px;
    margin-top:5px;
}

.user-box{
    text-align:center;
    color:#aaa;
    font-size:13px;
    padding:8px;
}

.login{
    max-width:450px;
    margin:40px auto;
    padding:15px;
}

.hidden{
    display:none !important;
}

.warning{
    background:#3b2d16;
    border:1px solid #765c29;
    border-radius:8px;
    padding:10px;
    color:#e5c477;
    margin-bottom:12px;
}
</style>
</head>

<body>

<header>
    🖨 PrintDesk
</header>

<!-- ================= LOGIN ================= -->

<div id="login-screen" class="login hidden">

    <div class="card">

        <h3>☁️ Вход в PrintDesk</h3>

        <div class="field">
            <label>Email</label>
            <input id="login-email" type="email" placeholder="your@email.com">
        </div>

        <div class="field">
            <label>Пароль</label>
            <input id="login-password" type="password" placeholder="Пароль">
        </div>

        <button class="btn" onclick="login()">
            🔐 Войти
        </button>

        <div class="status" id="login-status"></div>

    </div>

</div>


<!-- ================= APP ================= -->

<div id="app" class="hidden">

<div class="container">

    <!-- ================= MAIN ================= -->

    <section id="page-main" class="page active">

        <div class="user-box">
            👤 <span id="user-email"></span>
        </div>

        <div class="card">

            <h3>Текущие остатки пластика</h3>

            <div id="summary"></div>

        </div>

        <div class="grid">

            <div class="stat">
                Печать (всего)
                <div class="val" id="total-grams">0 г</div>
            </div>

            <div class="stat">
                Прибыль
                <div class="val green" id="profit">0.00 €</div>
            </div>

        </div>

        <button class="btn" onclick="showPage('calc')">
            📦 Новый расчёт
        </button>

        <button class="btn secondary" onclick="loadData()">
            🔄 Обновить данные
        </button>

        <button class="btn danger" onclick="logout()">
            🚪 Выйти
        </button>

        <div class="status" id="status"></div>

    </section>


    <!-- ================= CALCULATOR ================= -->

    <section id="page-calc" class="page">

        <div class="card">

            <h3>Новый расчёт</h3>

            <div class="field">
                <label>Название модели</label>
                <input id="model" value="Деталь">
            </div>

            <div class="field">
                <label>Катушка</label>
                <select id="calc-spool" onchange="calculate()"></select>
            </div>

            <div class="field">
                <label>Вес модели (г)</label>
                <input
                    id="calc-weight"
                    type="number"
                    min="0"
                    value="100"
                    oninput="calculate()"
                >
            </div>

            <div class="field">
                <label>Время печати (ч)</label>
                <input
                    id="calc-time"
                    type="number"
                    min="0"
                    step="0.1"
                    value="4"
                    oninput="calculate()"
                >
            </div>

            <div class="result">
                <span>Материал</span>
                <span id="mat">0.00 €</span>
            </div>

            <div class="result">
                <span>Электричество</span>
                <span id="elec">0.00 €</span>
            </div>

            <div class="result">
                <span>Амортизация</span>
                <span id="amort">0.00 €</span>
            </div>

            <div class="result total">
                <span>Себестоимость</span>
                <span id="cost">0.00 €</span>
            </div>

            <div
                class="result total"
                style="color:#00adb5"
            >
                <span>Итоговая цена</span>
                <span id="price">0.00 €</span>
            </div>

            <div class="field">

                <label>Заметка</label>

                <textarea
                    id="order-notes"
                    placeholder="Например: тестовая печать"
                ></textarea>

            </div>

            <button class="btn" onclick="saveOrder()">
                💾 Сохранить заказ
            </button>

        </div>

    </section>


    <!-- ================= SPOOLS ================= -->

    <section id="page-spools" class="page">

        <div class="card">

            <h3>Добавить катушку</h3>

            <div class="field">
                <label>Название</label>
                <input
                    id="spool-name"
                    placeholder="Anycubic PLA Black"
                >
            </div>

            <div class="field">
                <label>Материал</label>

                <select id="spool-material">

                    <option value="PLA">PLA</option>
                    <option value="PLA+">PLA+</option>
                    <option value="PETG">PETG</option>
                    <option value="ASA">ASA</option>
                    <option value="ABS">ABS</option>
                    <option value="TPU">TPU</option>
                    <option value="Other">Другое</option>

                </select>

            </div>

            <div class="field">

                <label>Цвет</label>

                <input
                    id="spool-color"
                    type="color"
                    value="#000000"
                    style="height:45px;padding:4px"
                >

            </div>

            <div class="field">

                <label>Вес пластика (г)</label>

                <input
                    id="spool-weight"
                    type="number"
                    value="1000"
                    min="1"
                >

            </div>

            <div class="field">

                <label>Цена катушки (€)</label>

                <input
                    id="spool-price"
                    type="number"
                    step="0.01"
                    value="19.99"
                    min="0"
                >

            </div>

            <div class="field">

                <label>Производитель</label>

                <input
                    id="spool-manufacturer"
                    placeholder="Anycubic / Sunlu..."
                >

            </div>

            <div class="field">

                <label>Дата покупки</label>

                <input
                    id="spool-purchase-date"
                    type="date"
                >

            </div>

            <div class="field">

                <label>Заметки</label>

                <textarea
                    id="spool-notes"
                    placeholder="Дополнительная информация"
                ></textarea>

            </div>

            <button class="btn" onclick="addSpool()">
                ➕ Добавить катушку
            </button>

        </div>

        <div id="spools-list"></div>

    </section>


    <!-- ================= HISTORY ================= -->

    <section id="page-history" class="page">

        <div class="card">

            <h3>История заказов</h3>

            <div id="history-list"></div>

        </div>

    </section>

</div>


<!-- ================= NAVIGATION ================= -->

<div class="nav">

    <div
        id="nav-main"
        class="active"
        onclick="showPage('main')"
    >
        <span>🏠</span>
        Главная
    </div>

    <div
        id="nav-calc"
        onclick="showPage('calc')"
    >
        <span>🧮</span>
        Расчёт
    </div>

    <div
        id="nav-spools"
        onclick="showPage('spools')"
    >
        <span>🧵</span>
        Катушки
    </div>

    <div
        id="nav-history"
        onclick="showPage('history')"
    >
        <span>📋</span>
        История
    </div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    'https://fxydodwbgixtlcptarro.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_SI7sEQyG02PQO3r_IRrBwA_OeIn3fU-';

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   SETTINGS
========================================================= */

const ELEC = 0.05;
const AMORT = 0.10;


/* =========================================================
   DATA
========================================================= */

let currentUser = null;

let spools = [];

let history = [];


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

    return String(value ?? '')
        .replace(/[&<>"']/g, c => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#039;'
        }[c]));

}


function setStatus(text, error=false){

    const el =
        document.getElementById('status');

    if(!el) return;

    el.textContent = text || '';

    el.style.color =
        error ? '#ff5252' : '#aaa';

}


function setLoginStatus(text, error=false){

    const el =
        document.getElementById('login-status');

    if(!el) return;

    el.textContent = text || '';

    el.style.color =
        error ? '#ff5252' : '#aaa';

}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth(){

    const result =
        await db.auth.getSession();

    if(result.error){

        console.error(result.error);

        showLogin();

        return;

    }

    const session =
        result.data.session;

    if(session){

        currentUser =
            session.user;

        showApp();

        await loadData();

    }else{

        showLogin();

    }

}


function showLogin(){

    document
        .getElementById('login-screen')
        .classList.remove('hidden');

    document
        .getElementById('app')
        .classList.add('hidden');

}


function showApp(){

    document
        .getElementById('login-screen')
        .classList.add('hidden');

    document
        .getElementById('app')
        .classList.remove('hidden');

    document
        .getElementById('user-email')
        .textContent =
        currentUser?.email || '';

}


async function login(){

    const email =
        document
            .getElementById('login-email')
            .value
            .trim();

    const password =
        document
            .getElementById('login-password')
            .value;

    if(!email || !password){

        setLoginStatus(
            'Введите email и пароль',
            true
        );

        return;

    }

    setLoginStatus(
        '🔐 Выполняется вход...'
    );

    const result =
        await db.auth.signInWithPassword({
            email,
            password
        });

    if(result.error){

        console.error(result.error);

        setLoginStatus(
            'Ошибка входа: ' +
            result.error.message,
            true
        );

        return;

    }

    currentUser =
        result.data.user;

    showApp();

    await loadData();

}


async function logout(){

    if(!confirm('Выйти из PrintDesk?')){

        return;

    }

    await db.auth.signOut();

    currentUser = null;

    spools = [];

    history = [];

    showLogin();

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

    if(!currentUser){

        return;

    }

    setStatus(
        '☁️ Загружаю данные...'
    );


    /* -----------------------------
       SPOOLS
    ----------------------------- */

    const spoolResult =
        await db
            .from('spools')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at',{
                ascending:true
            });


    if(spoolResult.error){

        console.error(
            'Ошибка катушек:',
            spoolResult.error
        );

        setStatus(
            'Ошибка загрузки катушек: ' +
            spoolResult.error.message,
            true
        );

        return;

    }


    /* -----------------------------
       HISTORY
    ----------------------------- */

    const historyResult =
        await db
            .from('print_history')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at',{
                ascending:false
            });


    if(historyResult.error){

        console.error(
            'Ошибка истории:',
            historyResult.error
        );

        setStatus(
            'Ошибка загрузки истории: ' +
            historyResult.error.message,
            true
        );

        return;

    }


    /* -----------------------------
       MAP SPOOLS
    ----------------------------- */

    spools =
        (spoolResult.data || [])
        .map(x => ({

            id:Number(x.id),

            name:x.name || '',

            material:x.material || '',

            color:x.color || '#000000',

            weight:Number(x.weight || 0),

            initialWeight:
                Number(
                    x.initial_weight || 1000
                ),

            price:
                Number(x.price || 0),

            manufacturer:
                x.manufacturer || '',

            purchaseDate:
                x.purchase_date || '',

            notes:
                x.notes || ''

        }));


    /* -----------------------------
       MAP HISTORY
    ----------------------------- */

    history =
        (historyResult.data || [])
        .map(x => ({

            id:Number(x.id),

            name:x.name || 'Деталь',

            weight:
                Number(x.weight || 0),

            cost:
                Number(x.cost || 0),

            profit:
                Number(x.profit || 0),

            date:
                x.date ||
                (
                    x.created_at
                        ? new Date(
                            x.created_at
                          ).toLocaleDateString(
                            'ru-RU'
                          )
                        : ''
                ),

            spoolName:
                x.spool_name || '',

            color:
                x.color || '#000000',

            notes:
                x.notes || '',

            spoolId:
                x.spool_id
                    ? Number(x.spool_id)
                    : null

        }));


    update();

    setStatus(
        `☁️ Синхронизировано · ` +
        `${spools.length} катушек · ` +
        `${history.length} записей`
    );

}


/* =========================================================
   ADD SPOOL
========================================================= */

async function addSpool(){

    if(!currentUser){

        alert('Пользователь не авторизован.');

        return;

    }


    const name =
        document
            .getElementById('spool-name')
            .value
            .trim();

    const material =
        document
            .getElementById('spool-material')
            .value;

    const color =
        document
            .getElementById('spool-color')
            .value;

    const weight =
        Number(
            document
                .getElementById('spool-weight')
                .value
        );

    const price =
        Number(
            document
                .getElementById('spool-price')
                .value
        );

    const manufacturer =
        document
            .getElementById('spool-manufacturer')
            .value
            .trim();

    const purchaseDate =
        document
            .getElementById('spool-purchase-date')
            .value || null;

    const notes =
        document
            .getElementById('spool-notes')
            .value
            .trim();


    if(!name){

        alert('Введите название катушки.');

        return;

    }

    if(weight <= 0){

        alert('Вес должен быть больше 0.');

        return;

    }

    if(price < 0){

        alert('Цена не может быть отрицательной.');

        return;

    }


    setStatus(
        '☁️ Сохраняю катушку...'
    );


    const result =
        await db
            .from('spools')
            .insert({

                name,

                material,

                color,

                weight,

                initial_weight:weight,

                price,

                manufacturer,

                purchase_date:purchaseDate,

                notes,

                user_id:currentUser.id

            })
            .select()
            .single();


    if(result.error){

        console.error(result.error);

        alert(
            'Ошибка сохранения катушки:\n' +
            result.error.message
        );

        setStatus(
            'Ошибка сохранения',
            true
        );

        return;

    }


    /* очищаем форму */

    document
        .getElementById('spool-name')
        .value='';

    document
        .getElementById('spool-weight')
        .value='1000';

    document
        .getElementById('spool-price')
        .value='19.99';

    document
        .getElementById('spool-manufacturer')
        .value='';

    document
        .getElementById('spool-purchase-date')
        .value='';

    document
        .getElementById('spool-notes')
        .value='';


    await loadData();

    alert(
        'Катушка сохранена в облако!'
    );

}


/* =========================================================
   DELETE SPOOL
========================================================= */

async function delSpool(id){

    if(!currentUser){

        return;

    }

    const spool =
        spools.find(x => x.id === id);

    if(!spool){

        return;

    }


    if(
        !confirm(
            `Удалить катушку "${spool.name}"?`
        )
    ){

        return;

    }


    const result =
        await db
            .from('spools')
            .delete()
            .eq('id',id)
            .eq('user_id',currentUser.id);


    if(result.error){

        alert(
            'Ошибка удаления:\n' +
            result.error.message
        );

        return;

    }


    await loadData();

}


/* =========================================================
   CALCULATOR
========================================================= */

function fillSelect(){

    const select =
        document
            .getElementById('calc-spool');


    if(!spools.length){

        select.innerHTML =
            '<option value="">Нет катушек</option>';

        calculate();

        return;

    }


    select.innerHTML =
        spools
            .map(s => {

                return `
                    <option value="${s.id}">
                        ${esc(s.name)}
                        · ${esc(s.material)}
                        · ${s.weight} г
                    </option>
                `;

            })
            .join('');


    calculate();

}


function calculate(){

    const select =
        document
            .getElementById('calc-spool');

    const id =
        Number(select.value);

    const spool =
        spools.find(
            x => x.id === id
        );


    if(!spool){

        document
            .getElementById('mat')
            .textContent='0.00 €';

        document
            .getElementById('elec')
            .textContent='0.00 €';

        document
            .getElementById('amort')
            .textContent='0.00 €';

        document
            .getElementById('cost')
            .textContent='0.00 €';

        document
            .getElementById('price')
            .textContent='0.00 €';

        return;

    }


    const weight =
        Number(
            document
                .getElementById('calc-weight')
                .value
        ) || 0;

    const time =
        Number(
            document
                .getElementById('calc-time')
                .value
        ) || 0;


    const materialCost =
        spool.initialWeight > 0
            ? weight *
              (
                  spool.price /
                  spool.initialWeight
              )
            : 0;


    const electricity =
        time * ELEC;

    const amortization =
        time * AMORT;

    const cost =
        materialCost +
        electricity +
        amortization;


    document
        .getElementById('mat')
        .textContent =
        materialCost.toFixed(2) +
        ' €';

    document
        .getElementById('elec')
        .textContent =
        electricity.toFixed(2) +
        ' €';

    document
        .getElementById('amort')
        .textContent =
        amortization.toFixed(2) +
        ' €';

    document
        .getElementById('cost')
        .textContent =
        cost.toFixed(2) +
        ' €';

    document
        .getElementById('price')
        .textContent =
        cost.toFixed(2) +
        ' €';

}


/* =========================================================
   SAVE ORDER
========================================================= */

async function saveOrder(){

    if(!currentUser){

        alert(
            'Пользователь не авторизован.'
        );

        return;

    }


    const spoolId =
        Number(
            document
                .getElementById('calc-spool')
                .value
        );


    const spool =
        spools.find(
            x => x.id === spoolId
        );


    if(!spool){

        alert(
            'Выберите катушку.'
        );

        return;

    }


    const name =
        document
            .getElementById('model')
            .value
            .trim() ||
        'Деталь';


    const weight =
        Number(
            document
                .getElementById('calc-weight')
                .value
        ) || 0;


    const time =
        Number(
            document
                .getElementById('calc-time')
                .value
        ) || 0;


    const notes =
        document
            .getElementById('order-notes')
            .value
            .trim();


    if(weight <= 0){

        alert(
            'Вес модели должен быть больше 0.'
        );

        return;

    }


    if(weight > spool.weight){

        alert(
            `Недостаточно пластика.\n\n` +
            `В катушке: ${spool.weight} г\n` +
            `Нужно: ${weight} г`
        );

        return;

    }


    const materialCost =
        spool.initialWeight > 0
            ? weight *
              (
                  spool.price /
                  spool.initialWeight
              )
            : 0;


    const electricity =
        time * ELEC;

    const amortization =
        time * AMORT;

    const cost =
        materialCost +
        electricity +
        amortization;


    const newWeight =
        spool.weight - weight;


    setStatus(
        '☁️ Сохраняю заказ...'
    );


    /* --------------------------------
       Сначала обновляем катушку
    -------------------------------- */

    const spoolUpdate =
        await db
            .from('spools')
            .update({
                weight:newWeight
            })
            .eq('id',spool.id)
            .eq('user_id',currentUser.id);


    if(spoolUpdate.error){

        console.error(
            spoolUpdate.error
        );

        alert(
            'Ошибка обновления катушки:\n' +
            spoolUpdate.error.message
        );

        return;

    }


    /* --------------------------------
       Затем записываем историю
    -------------------------------- */

    const historyInsert =
        await db
            .from('print_history')
            .insert({

                name,

                weight,

                cost,

                profit:0,

                date:
                    new Date()
                        .toLocaleDateString(
                            'ru-RU'
                        ),

                spool_name:
                    spool.name,

                color:
                    spool.color,

                notes,

                spool_id:
                    spool.id,

                user_id:
                    currentUser.id

            })
            .select()
            .single();


    if(historyInsert.error){

        console.error(
            historyInsert.error
        );


        /* откатываем вес */

        await db
            .from('spools')
            .update({
                weight:spool.weight
            })
            .eq('id',spool.id)
            .eq('user_id',currentUser.id);


        alert(
            'Ошибка сохранения истории:\n' +
            historyInsert.error.message
        );

        return;

    }


    /* --------------------------------
       Обновляем интерфейс
    -------------------------------- */

    await loadData();


    document
        .getElementById('order-notes')
        .value='';


    alert(
        'Заказ сохранён!'
    );


    showPage('main');

}


/* =========================================================
   SHOW PAGE
========================================================= */

function showPage(page){

    document
        .querySelectorAll('.page')
        .forEach(
            x =>
            x.classList.remove('active')
        );


    document
        .querySelectorAll('.nav div')
        .forEach(
            x =>
            x.classList.remove('active')
        );


    const pageElement =
        document.getElementById(
            'page-' + page
        );

    const navElement =
        document.getElementById(
            'nav-' + page
        );


    if(pageElement){

        pageElement
            .classList.add('active');

    }

    if(navElement){

        navElement
            .classList.add('active');

    }


    if(page === 'calc'){

        fillSelect();

    }


    update();

}


/* =========================================================
   UPDATE UI
========================================================= */

function update(){

    /* --------------------------------
       Summary
    -------------------------------- */

    const summary =
        document.getElementById(
            'summary'
        );


    if(!spools.length){

        summary.innerHTML =
            '<div class="empty">' +
            'Катушек пока нет.' +
            '</div>';

    }else{

        summary.innerHTML =
            spools
                .map(s => {

                    return `
                        <div
                            style="
                            display:flex;
                            align-items:center;
                            gap:9px;
                            padding:7px 0;
                            border-bottom:1px solid #333;
                            "
                        >

                            <span
                                class="color-dot"
                                style="background:${esc(s.color)}"
                            ></span>

                            <div>
                                <b>${esc(s.name)}</b>

                                <div class="small">
                                    ${esc(s.material)}
                                    · ${s.weight} г
                                </div>
                            </div>

                        </div>
                    `;

                })
                .join('');

    }


    /* --------------------------------
       Total grams
    -------------------------------- */

    const totalGrams =
        history.reduce(
            (sum,item) =>
                sum +
                (
                    Number(item.weight) ||
                    0
                ),
            0
        );


    document
        .getElementById('total-grams')
        .textContent =
        totalGrams.toFixed(0) +
        ' г';


    /* --------------------------------
       Profit
    -------------------------------- */

    const profit =
        history.reduce(
            (sum,item) =>
                sum +
                (
                    Number(item.profit) ||
                    0
                ),
            0
        );


    document
        .getElementById('profit')
        .textContent =
        profit.toFixed(2) +
        ' €';


    /* --------------------------------
       Spools list
    -------------------------------- */

    const spoolList =
        document
            .getElementById(
                'spools-list'
            );


    if(!spools.length){

        spoolList.innerHTML =
            '<div class="empty">' +
            'Катушек пока нет.' +
            '</div>';

    }else{

        spoolList.innerHTML =
            spools
                .map(s => {

                    return `
                        <div class="spool">

                            <button
                                class="delete"
                                onclick="delSpool(${s.id})"
                            >
                                🗑️
                            </button>

                            <div class="spool-title">

                                <span
                                    class="color-dot"
                                    style="
                                    background:${esc(s.color)}
                                    "
                                ></span>

                                <div>

                                    <b>
                                        ${esc(s.name)}
                                    </b>

                                    <div class="small">
                                        ${esc(s.material)}
                                        ${s.manufacturer
                                            ? ' · ' +
                                              esc(
                                                s.manufacturer
                                              )
                                            : ''
                                        }
                                    </div>

                                </div>

                            </div>

                            <div style="margin-top:10px">
                                Осталось:
                                <b>${s.weight} г</b>
                            </div>

                            <div class="small">
                                Цена:
                                ${s.price.toFixed(2)} €
                                ·
                                Начальный вес:
                                ${s.initialWeight} г
                            </div>

                            ${
                                s.purchaseDate
                                ? `
                                    <div class="small">
                                        Куплено:
                                        ${esc(
                                            s.purchaseDate
                                        )}
                                    </div>
                                  `
                                : ''
                            }

                            ${
                                s.notes
                                ? `
                                    <div class="small">
                                        📝 ${esc(s.notes)}
                                    </div>
                                  `
                                : ''
                            }

                        </div>
                    `;

                })
                .join('');

    }


    /* --------------------------------
       History
    -------------------------------- */

    const historyList =
        document
            .getElementById(
                'history-list'
            );


    if(!history.length){

        historyList.innerHTML =
            '<div class="empty">' +
            'История пуста.' +
            '</div>';

    }else{

        historyList.innerHTML =
            history
                .map(h => {

                    return `
                        <div class="history">

                            <div>

                                ${
                                    h.color
                                    ? `
                                        <span
                                            class="history-color"
                                            style="
                                            background:${esc(
                                                h.color
                                            )}
                                            "
                                        ></span>
                                      `
                                    : ''
                                }

                                <b>
                                    ${esc(h.name)}
                                </b>

                                <span
                                    style="
                                    float:right;
                                    color:#888;
                                    font-size:13px;
                                    "
                                >
                                    ${esc(h.date)}
                                </span>

                            </div>

                            ${
                                h.spoolName
                                ? `
                                    <div class="small">
                                        🧵
                                        ${esc(
                                            h.spoolName
                                        )}
                                    </div>
                                  `
                                : ''
                            }

                            <div style="margin-top:7px">
                                ${Number(h.weight).toFixed(0)}
                                г
                                ·
                                ${Number(h.cost).toFixed(2)}
                                €
                            </div>

                            ${
                                h.notes
                                ? `
                                    <div class="small">
                                        📝
                                        ${esc(h.notes)}
                                    </div>
                                  `
                                : ''
                            }

                        </div>
                    `;

                })
                .join('');

    }

}


/* =========================================================
   AUTH STATE LISTENER
========================================================= */

db.auth.onAuthStateChange(
    async (event,session) => {

        console.log(
            'Auth event:',
            event
        );


        if(session){

            currentUser =
                session.user;

            showApp();

            /*
             Не делаем лишний запрос,
             если данные уже загрузились
            */

            if(
                !spools.length &&
                !history.length
            ){

                await loadData();

            }

        }else{

            currentUser = null;

            spools = [];

            history = [];

            showLogin();

        }

    }
);


/* =========================================================
   START
========================================================= */

checkAuth();

</script>
