<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintDesk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#121212;color:#eee;font-family:Arial,sans-serif;padding-bottom:70px}header{padding:16px;text-align:center;background:#1e1e1e;color:#00adb5;font-size:21px;font-weight:700;border-bottom:1px solid #333}.container{max-width:620px;margin:auto;padding:15px}.card,.spool,.history{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:15px;margin-bottom:15px}.card h3{color:#00adb5;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#252525;border-radius:9px;padding:12px;text-align:center}.val{font-size:19px;font-weight:bold;margin-top:5px}.green{color:#4caf50}.btn{width:100%;border:0;border-radius:8px;padding:12px;margin-top:10px;background:#00adb5;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.btn.secondary{background:#333}.field{margin-bottom:12px}.field label{display:block;color:#aaa;font-size:14px;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #444;border-radius:7px;background:#252525;color:#fff;font-size:15px}.result{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #444}.total{font-weight:700;font-size:18px;padding:10px 0}.page{display:none}.page.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#1e1e1e;border-top:1px solid #333;display:flex;z-index:5}.nav div{flex:1;text-align:center;padding:9px 3px;color:#888;font-size:12px;cursor:pointer}.nav .active{color:#00adb5;font-weight:700}.nav span{display:block;font-size:18px;margin-bottom:2px}.status{text-align:center;color:#aaa;font-size:13px;min-height:18px;margin-top:10px}.delete{float:right;background:none;border:0;color:#ff5252;font-size:18px;cursor:pointer}.empty{color:#999}
</style>
</head>
<body>
<header>🖨 PrintDesk</header>
<div class="container">
<section id="page-main" class="page active">
<div class="card"><h3>Текущие остатки пластика</h3><div id="summary"></div></div>
<div class="grid"><div class="stat">Печать (всего)<div class="val" id="total-grams">0 г</div></div><div class="stat">Прибыль<div class="val green" id="profit">0.00 €</div></div></div>
<button class="btn" onclick="showPage('calc')">📦 Новый расчёт</button>
<button class="btn secondary" onclick="importLocal()">☁️ Перенести данные с этого устройства</button>
<div class="status" id="status"></div>
</section>
<section id="page-calc" class="page"><div class="card"><h3>Новый расчёт</h3>
<div class="field"><label>Название модели</label><input id="model" value="Деталь"></div>
<div class="field"><label>Катушка</label><select id="calc-spool" onchange="calculate()"></select></div>
<div class="field"><label>Вес модели (г)</label><input id="calc-weight" type="number" value="100" oninput="calculate()"></div>
<div class="field"><label>Время печати (ч)</label><input id="calc-time" type="number" value="4" oninput="calculate()"></div>
<div class="result"><span>Материал</span><span id="mat">0.00 €</span></div><div class="result"><span>Электричество</span><span id="elec">0.00 €</span></div><div class="result"><span>Амортизация</span><span id="amort">0.00 €</span></div><div class="result total"><span>Себестоимость</span><span id="cost">0.00 €</span></div><div class="result total" style="color:#00adb5"><span>Итоговая цена</span><span id="price">0.00 €</span></div>
<button class="btn" onclick="saveOrder()">💾 Сохранить заказ</button></div></section>
<section id="page-spools" class="page"><div class="card"><h3>Добавить катушку</h3><div class="field"><label>Название / цвет</label><input id="spool-name" placeholder="Anycubic PLA Black"></div><div class="field"><label>Вес пластика (г)</label><input id="spool-weight" type="number" value="1000"></div><div class="field"><label>Цена катушки (€)</label><input id="spool-price" type="number" step="0.01" value="19.99"></div><button class="btn" onclick="addSpool()">➕ Добавить катушку</button></div><div id="spools-list"></div></section>
<section id="page-history" class="page"><div class="card"><h3>История заказов</h3><div id="history-list"></div></div></section>
</div>
<div class="nav"><div id="nav-main" class="active" onclick="showPage('main')"><span>🏠</span>Главная</div><div id="nav-calc" onclick="showPage('calc')"><span>🧮</span>Расчёт</div><div id="nav-spools" onclick="showPage('spools')"><span>🧵</span>Катушки</div><div id="nav-history" onclick="showPage('history')"><span>📋</span>История</div></div>
<script>
const SUPABASE_URL='https://fxydodwbgixtlcptarro.supabase.co';
const SUPABASE_KEY='sb_publishable_SI7sEQyG02PQO3r_IRrBwA_OeIn3fU-';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ELEC=0.05,AMORT=0.10;
let spools=[],history=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const local=(k)=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}};
function status(t,err=false){let e=document.getElementById('status');e.textContent=t||'';e.style.color=err?'#ff5252':'#aaa'}
async function load(){status('☁️ Загружаю данные...');let [s,h]=await Promise.all([db.from('spools').select('*').order('created_at',{ascending:true}),db.from('print_history').select('*').order('created_at',{ascending:false})]);if(s.error||h.error){console.error(s.error||h.error);spools=local('pd_spools');history=local('pd_history');status('⚠️ Облако недоступно — локальные данные',true)}else{spools=(s.data||[]).map(x=>({id:Number(x.id),name:x.name,weight:Number(x.weight||0),initWeight:Number(x.initial_weight||1000),price:Number(x.price||0)}));history=(h.data||[]).map(x=>({id:Number(x.id),name:x.name,weight:Number(x.weight||0),price:Number(x.cost||0),profit:Number(x.profit||0),date:x.date||new Date(x.created_at).toLocaleDateString('ru-RU')}));status('☁️ Синхронизировано')}update();}
async function addSpool(){let name=document.getElementById('spool-name').value.trim(),weight=+document.getElementById('spool-weight').value,price=+document.getElementById('spool-price').value;if(!name||weight<=0||price<0)return alert('Проверьте название, вес и цену.');let r=await db.from('spools').insert({name,weight,initial_weight:weight,price}).select().single();if(r.error)return alert('Ошибка: '+r.error.message);spools.push({id:Number(r.data.id),name:r.data.name,weight:Number(r.data.weight),initWeight:Number(r.data.initial_weight),price:Number(r.data.price)});document.getElementById('spool-name').value='';update();alert('Катушка сохранена в облако!')}
async function delSpool(id){if(!confirm('Удалить катушку?'))return;let r=await db.from('spools').delete().eq('id',id);if(r.error)return alert(r.error.message);spools=spools.filter(x=>x.id!==id);update()}
function calculate(){let id=+document.getElementById('calc-spool').value,s=spools.find(x=>x.id===id);if(!s)return;let w=+document.getElementById('calc-weight').value||0,t=+document.getElementById('calc-time').value||0,m=w*(s.price/s.initWeight),e=t*ELEC,a=t*AMORT,c=m+e+a;document.getElementById('mat').textContent=m.toFixed(2)+' €';document.getElementById('elec').textContent=e.toFixed(2)+' €';document.getElementById('amort').textContent=a.toFixed(2)+' €';document.getElementById('cost').textContent=c.toFixed(2)+' €';document.getElementById('price').textContent=c.toFixed(2)+' €'}
async function saveOrder(){let id=+document.getElementById('calc-spool').value,s=spools.find(x=>x.id===id),w=+document.getElementById('calc-weight').value||0,t=+document.getElementById('calc-time').value||0,name=document.getElementById('model').value.trim()||'Деталь';if(!s)return alert('Добавьте катушку.');if(w<=0||s.weight<w)return alert('Недостаточно пластика.');let nw=s.weight-w,m=w*(s.price/s.initWeight),cost=m+t*(ELEC+AMORT);let u=await db.from('spools').update({weight:nw}).eq('id',s.id);if(u.error)return alert('Ошибка обновления катушки: '+u.error.message);let r=await db.from('print_history').insert({name,weight:w,cost,profit:0,date:new Date().toLocaleDateString('ru-RU')}).select().single();if(r.error){await db.from('spools').update({weight:s.weight}).eq('id',s.id);return alert('Ошибка сохранения истории: '+r.error.message)}s.weight=nw;history.unshift({id:Number(r.data.id),name,weight:w,cost,price:cost,profit:0,date:r.data.date});update();alert('Заказ сохранён!');showPage('main')}
async function importLocal(){let lh=local('pd_history');if(!lh.length)return alert('Локальная история PrintDesk не найдена.');let h=await db.from('print_history').select('id');if(h.error)return alert('Не удалось проверить историю: '+h.error.message);if((h.data||[]).length)return alert('В облаке уже есть записи истории. Импорт остановлен, чтобы не создать дубликаты.');if(!confirm(`Перенести ${lh.length} записей истории в облако?`))return;let rows=lh.map(x=>({name:x.name||x.model||'Деталь',weight:+x.weight||0,cost:+(x.price??x.cost??0),profit:+x.profit||0,date:x.date||new Date().toLocaleDateString('ru-RU')}));let r=await db.from('print_history').insert(rows);if(r.error)return alert('Ошибка переноса истории: '+r.error.message);await load();alert('Готово! История перенесена в облако.')}

function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav div').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.getElementById('nav-'+p).classList.add('active');if(p==='calc')fillSelect();update()}
function fillSelect(){let e=document.getElementById('calc-spool');e.innerHTML=spools.length?spools.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.weight}г)</option>`).join(''):'<option value="">Нет катушек</option>';calculate()}
function update(){let sum=document.getElementById('summary');sum.innerHTML=spools.length?spools.map(s=>`<div>🟢 <b>${esc(s.name)}</b>: ${s.weight} г</div>`).join(''):'<div class="empty">Катушек пока нет.</div>';document.getElementById('total-grams').textContent=history.reduce((a,x)=>a+(+x.weight||0),0)+' г';document.getElementById('profit').textContent=history.reduce((a,x)=>a+(+x.profit||0),0).toFixed(2)+' €';document.getElementById('spools-list').innerHTML=spools.map(s=>`<div class="spool"><button class="delete" onclick="delSpool(${s.id})">🗑️</button><b>${esc(s.name)}</b><div>${s.weight} г осталось · ${s.price.toFixed(2)} €</div></div>`).join('');document.getElementById('history-list').innerHTML=history.length?history.map(h=>`<div class="history"><b>${esc(h.name)}</b><span style="float:right;color:#888">${esc(h.date)}</span><div>${(+h.weight).toFixed(0)} г · ${(+h.price).toFixed(2)} €</div></div>`).join(''):'<div class="empty">История пуста.</div>';}
load();
</script>
</body></html>
